# The Xcode project for App Store and TestFlight builds, generated by XcodeGen on a cloud Mac
# (.github/workflows/ios-testflight.yml). Everyday builds use xtool and ignore this folder.
#
# The app target is a shell around the PDFEditor library of ../Package.swift (where @main
# lives), the same way xtool packages it, plus what the App Store needs and xtool's .ipa lacks:
# a compiled app icon (asset catalog), a launch screen and App Store signing.
name: PDFEditor
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  PDFEditorKit:
    path: ..
targets:
  PDFEditorApp:
    type: application
    platform: iOS
    sources:
      - path: empty.c
      - path: Assets.xcassets
      - path: ../Resources/Models
        type: folder
        buildPhase: resources
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PDFEditorKit
        product: PDFEditor
    settings:
      base:
        PRODUCT_NAME: PDFEditorApp
        PRODUCT_BUNDLE_IDENTIFIER: com.alirmdn.pdfeditor
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
        MARKETING_VERSION: ${APP_VERSION}
        CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
schemes:
  PDFEditor:
    build:
      targets:
        PDFEditorApp: all
    archive:
      config: Release
