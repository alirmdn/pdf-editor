name: iOS TestFlight

# Builds PDF Editor for iPhone and iPad on a cloud Mac and uploads it to TestFlight.
# Manual only: Actions ▸ iOS TestFlight ▸ Run workflow (macOS minutes count 10x on a private repo).
#
# Repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   APPLE_TEAM_ID   your 10-character team ID (developer.apple.com ▸ Membership)
#   ASC_KEY_ID      App Store Connect API key ID     } Users and Access ▸ Integrations ▸
#   ASC_ISSUER_ID   the issuer ID shown above keys   } App Store Connect API (Admin role)
#   ASC_KEY_P8      the whole text of the AuthKey_XXXX.p8 file
# The app record (bundle ID com.alirmdn.pdfeditor) must exist in App Store Connect first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in the App Store (e.g. 1.0.0)
        default: "1.0.0"
      runner:
        description: Which cloud Mac (try Intel when Apple-chip Macs are busy and the run is dropped)
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
      compile_only:
        description: Only check that the app builds (no signing, no upload, no secrets needed)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'NONE' }}
      APP_VERSION: ${{ inputs.version }}
      # Every upload needs a higher build number than the last.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Use the newest Xcode (App Store uploads need a current SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-arm64

      - name: Check the secrets are set
        if: ${{ !inputs.compile_only }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] && [ "${!v}" != NONE ] || { echo "::error::The repository secret $v is not set (see the top of this workflow)"; exit 1; }
          done

      - name: Build the PDF engine for iPhone
        run: |
          cargo build --release --locked -p pdfcraft-mobile --target aarch64-apple-ios
          mkdir -p ios/Vendor/ios-arm64
          cp target/aarch64-apple-ios/release/libpdfeditor_core.a ios/Vendor/ios-arm64/

      - name: Text recognition models
        run: cargo run -q -p xtask -- models ios/Resources/Models

      - name: Generate the Xcode project
        run: ios/AppStore/prepare.sh

      - name: Compile only (unsigned)
        if: ${{ inputs.compile_only }}
        run: |
          xcodebuild -project ios/AppStore/PDFEditor.xcodeproj -scheme PDFEditor -configuration Release \
            -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build

      - name: Archive (signed for the App Store)
        if: ${{ !inputs.compile_only }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Apple's messages also become annotations on the run, so they show on its summary page.
          report() {
            grep -E "error:|Error Domain|ITMS-|No (signing|profiles|Accounts)|Provisioning|certificate|Upload failed|Validation failed|NSLocalizedDescription|NSLocalizedFailureReason" "$1" \
              | grep -v "warning:" | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          }
          set -o pipefail
          xcodebuild -project ios/AppStore/PDFEditor.xcodeproj -scheme PDFEditor -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/PDFEditor.xcarchive" \
            "${AUTH[@]}" archive 2>&1 | tee "$RUNNER_TEMP/archive.log" || { report "$RUNNER_TEMP/archive.log"; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          echo "==> Signing the .ipa for the App Store"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PDFEditor.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}" 2>&1 | tee "$RUNNER_TEMP/export.log" || { report "$RUNNER_TEMP/export.log"; exit 1; }
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "==> Uploading build $BUILD_NUMBER (version $APP_VERSION) to App Store Connect: $IPA"
          # altool reads the key from ~/.appstoreconnect/private_keys and reports Apple's own errors.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal \
            2>&1 | tee "$RUNNER_TEMP/upload.log" || { report "$RUNNER_TEMP/upload.log"; exit 1; }
          # altool's own verdict, on the run page.
          grep -iE "upload|error|succeeded|failed|delivery|uuid" "$RUNNER_TEMP/upload.log" | head -20 | while IFS= read -r line; do echo "::notice::$line"; done
          if grep -qiE "error|failed" "$RUNNER_TEMP/upload.log" && ! grep -qi "UPLOAD SUCCEEDED" "$RUNNER_TEMP/upload.log"; then
            report "$RUNNER_TEMP/upload.log"; exit 1
          fi
          rm -rf ~/.appstoreconnect/private_keys
          rm -f "$KEY"
          echo "Uploaded. It appears in TestFlight after Apple processes it (usually 5-30 minutes)."
