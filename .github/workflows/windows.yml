name: Windows installer

# Manual only (Actions ▸ Windows installer ▸ Run workflow): builds use Actions minutes. Everyday
# builds run on your own PC with "Build PDF Editor.bat".
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g "WixToolset.UI.wixext/5.0.2" "WixToolset.Util.wixext/5.0.2"
      - name: Build and package
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-editor-windows-x64
          path: dist/release/*
          if-no-files-found: error
